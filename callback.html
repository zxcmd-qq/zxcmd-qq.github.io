<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autopost — authorization</title><link rel="stylesheet" href="style.css"></head><body>
<h1>Autopost</h1>
<div id="box"></div>
<script>
const p = new URLSearchParams(location.search);
const code = p.get("code"), err = p.get("error_description") || p.get("error"), state = p.get("state");
const box = document.getElementById("box");
if (code && state && state.startsWith("post")) {
  sessionStorage.setItem("tt_code", code);
  location.replace("post.html");
} else if (code) {
  box.innerHTML = '<p>✅ Authorized. Copy the code:</p>' +
    '<textarea id="c" rows="4" style="width:100%;font-size:14px" readonly></textarea>' +
    '<p><button id="b" style="font-size:16px;padding:8px 16px">Copy</button> <span id="ok"></span></p>';
  document.getElementById("c").value = code;
  document.getElementById("b").onclick = async () => {
    await navigator.clipboard.writeText(code); document.getElementById("ok").textContent = "Copied ✔︎";
  };
} else if (err) {
  box.textContent = "Error: " + err;
} else {
  box.innerHTML = 'This page receives the authorization code. <a href="post.html">Go to Autopost</a>';
}
</script>
</body></html>
