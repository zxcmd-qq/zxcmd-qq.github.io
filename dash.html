<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Статы">
<meta name="theme-color" content="#0b0b10">
<link rel="apple-touch-icon" href="dash-icon.png">
<link rel="manifest" href="dash.webmanifest">
<title>Статы</title>
<style>
  :root{
    --bg:#0b0b10; --card:#15151d; --card2:#1c1c26; --line:#262633; --txt:#f2f2f7; --mut:#8e8e9a;
    --up:#34c759; --down:#ff453a;
    --yt:#ff3b30; --tg:#2aabee; --ig:#e1306c; --tt:#25f4ee;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}
  body{padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 24px);max-width:560px;margin:0 auto;overscroll-behavior-y:contain}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  h1{font-size:28px;font-weight:800;margin:0;letter-spacing:-.5px}
  .upd{color:var(--mut);font-size:13px;margin-top:2px}
  .btn{border:0;background:var(--card2);color:var(--txt);width:42px;height:42px;border-radius:50%;font-size:20px;display:grid;place-items:center}
  .btn.spin span{display:inline-block;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .hero{background:linear-gradient(135deg,#2a1b4d,#16162a 55%,#0f2833);border-radius:24px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden}
  .hero .lbl{color:#c9c6e8;font-size:13px;text-transform:uppercase;letter-spacing:.08em}
  .hero .big{font-size:46px;font-weight:800;letter-spacing:-1.5px;margin:4px 0 2px}
  .delta{font-size:14px;font-weight:600}
  .delta.up{color:var(--up)} .delta.down{color:var(--down)} .delta.zero{color:var(--mut)}
  .bars{display:flex;height:8px;border-radius:6px;overflow:hidden;margin-top:14px;background:#ffffff14}
  .bars i{display:block;height:100%}
  .legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:#c9c6e8}
  .legend b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
  .card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
  .top{display:flex;align-items:center;gap:12px}
  .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none;color:#fff;font-weight:800}
  .ava{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none;background:var(--card2)}
  .name{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .plat{color:var(--mut);font-size:13px}
  .grow{flex:1;min-width:0}
  .open{color:var(--mut);text-decoration:none;font-size:22px;padding:4px 2px}
  .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .num{background:var(--card2);border-radius:14px;padding:10px}
  .num .v{font-size:20px;font-weight:800;letter-spacing:-.3px}
  .num .k{font-size:12px;color:var(--mut)}
  .num .d{font-size:12px;font-weight:600}
  .recent{display:flex;gap:10px;overflow-x:auto;margin:14px 0 0;padding:0 0 2px;scroll-snap-type:x mandatory;scrollbar-width:none}
  .recent::-webkit-scrollbar{display:none}
  .post{flex:none;width:118px;scroll-snap-align:start;text-decoration:none;color:var(--txt)}
  .post .th{width:118px;height:160px;border-radius:12px;background:var(--card2) center/cover no-repeat;position:relative}
  .post .th span{position:absolute;left:6px;bottom:6px;background:#000a;border-radius:8px;padding:2px 7px;font-size:12px;font-weight:700}
  .post .t{font-size:12px;color:var(--mut);margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .err{color:#ff9f0a;font-size:13px;margin-top:10px}
  .off{opacity:.55}
  .foot{color:var(--mut);font-size:12px;text-align:center;margin-top:18px}
  .skel{background:linear-gradient(90deg,var(--card) 0%,var(--card2) 50%,var(--card) 100%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:20px;height:150px;margin-bottom:12px}
  @keyframes sk{to{background-position:-200% 0}}
</style>
</head>
<body>
<header>
  <div><h1>Статы</h1><div class="upd" id="upd">загрузка…</div></div>
  <button class="btn" id="ref" aria-label="Обновить"><span>↻</span></button>
</header>
<div id="app"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
<div class="foot">Цифры кэшируются на 10 минут · Δ — с прошлого захода</div>

<script src="config.js"></script>
<script>
const W = (window.AUTOPOST && window.AUTOPOST.WORKER || "").replace(/\/$/, "");
const URL_ = (W.startsWith("http") ? W : "https://" + W) + "/stats";
const PL = {
  youtube:   { name: "YouTube",   c: "var(--yt)", i: "▶", k: ["Подписчики", "Просмотры", "Видео"], f: ["followers", "views", "posts"] },
  telegram:  { name: "Telegram",  c: "var(--tg)", i: "✈", k: ["Подписчики"], f: ["followers"] },
  instagram: { name: "Instagram", c: "var(--ig)", i: "◎", k: ["Подписчики", "Публикации"], f: ["followers", "posts"] },
};
const fmt = n => n == null || isNaN(n) ? "—" : n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(".0", "") + "M"
  : n >= 1e4 ? (n / 1e3).toFixed(n >= 1e5 ? 0 : 1).replace(".0", "") + "K" : n.toLocaleString("ru-RU");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function ago(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 1 ? "только что" : m < 60 ? m + " мин назад" : m < 1440 ? Math.round(m / 60) + " ч назад" : Math.round(m / 1440) + " дн назад";
}
function load(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
function delta(cur, prev) {
  if (prev == null || cur == null) return "";
  const d = cur - prev;
  return `<div class="d delta ${d > 0 ? "up" : d < 0 ? "down" : "zero"}">${d > 0 ? "▲ +" + fmt(d) : d < 0 ? "▼ −" + fmt(-d) : "· 0"}</div>`;
}

function render(data) {
  const prev = load("stats_prev") || {};
  const app = document.getElementById("app");
  let html = "", total = 0, prevTotal = 0, hasPrev = false, parts = [];
  for (const [id, p] of Object.entries(PL)) {
    const d = data[id];
    if (d && !d.error && d.followers != null) {
      total += d.followers; parts.push([p.c, d.followers, p.name]);
      if (prev[id] && prev[id].followers != null) { prevTotal += prev[id].followers; hasPrev = true; } else prevTotal += d.followers;
    }
  }
  const td = total - prevTotal;
  html += `<div class="hero"><div class="lbl">Всего подписчиков</div><div class="big">${fmt(total)}</div>
    ${hasPrev ? `<div class="delta ${td > 0 ? "up" : td < 0 ? "down" : "zero"}">${td > 0 ? "▲ +" + fmt(td) : td < 0 ? "▼ −" + fmt(-td) : "без изменений"} с прошлого раза</div>` : `<div class="delta zero">первый заход — дальше покажу прирост</div>`}
    <div class="bars">${parts.map(([c, v]) => `<i style="width:${total ? v / total * 100 : 0}%;background:${c}"></i>`).join("")}</div>
    <div class="legend">${parts.map(([c, v, n]) => `<span><b style="background:${c}"></b>${n} ${fmt(v)}</span>`).join("")}</div></div>`;

  for (const [id, p] of Object.entries(PL)) {
    const d = data[id];
    if (!d) { html += `<div class="card off"><div class="top"><div class="ico" style="background:${p.c}">${p.i}</div><div class="grow"><div class="name">${p.name}</div><div class="plat">не подключён</div></div></div></div>`; continue; }
    const pv = prev[id] || {};
    html += `<div class="card"><div class="top">
      ${d.avatar ? `<img class="ava" src="${esc(d.avatar)}" alt="">` : `<div class="ico" style="background:${p.c}">${p.i}</div>`}
      <div class="grow"><div class="name">${esc(d.title || p.name)}</div><div class="plat" style="color:${p.c}">${p.name}</div></div>
      ${d.url ? `<a class="open" href="${esc(d.url)}" target="_blank" rel="noopener">›</a>` : ""}</div>`;
    if (d.error) { html += `<div class="err">⚠️ ${esc(d.error)}</div></div>`; continue; }
    html += `<div class="nums" style="grid-template-columns:repeat(${p.f.length},1fr)">` +
      p.f.map((f, i) => `<div class="num"><div class="v">${fmt(d[f])}</div><div class="k">${p.k[i]}</div>${delta(d[f], pv[f])}</div>`).join("") + `</div>`;
    if (d.recent && d.recent.length) {
      html += `<div class="recent">` + d.recent.map(r => `<a class="post" href="${esc(r.url)}" target="_blank" rel="noopener">
        <div class="th" style="background-image:url('${esc(r.thumb || "")}')"><span>${r.views != null ? "👁 " + fmt(r.views) : "♥ " + fmt(r.likes)}</span></div>
        <div class="t">${esc(r.title || "без подписи")}</div></a>`).join("") + `</div>`;
    }
    html += `</div>`;
  }
  app.innerHTML = html;
  document.getElementById("upd").textContent = "обновлено " + ago(data.updated);
}

async function refresh(force) {
  const b = document.getElementById("ref"); b.classList.add("spin");
  try {
    const r = await fetch(URL_ + (force ? "?fresh=1" : ""), { cache: "no-store" });
    const data = await r.json();
    const cached = load("stats_last");
    // «прошлый раз» = последний снимок старше 30 минут, чтобы прирост не обнулялся при каждом обновлении
    if (cached && (!load("stats_prev_t") || Date.now() - load("stats_prev_t") > 30 * 60e3)) {
      save("stats_prev", cached); save("stats_prev_t", Date.now());
    }
    save("stats_last", data);
    render(data);
  } catch (e) {
    const cached = load("stats_last");
    if (cached) { render(cached); document.getElementById("upd").textContent = "нет сети · показаны старые цифры"; }
    else document.getElementById("app").innerHTML = `<div class="card"><div class="err">Не удалось загрузить: ${esc(e.message)}</div></div>`;
  } finally { b.classList.remove("spin"); }
}
document.getElementById("ref").onclick = () => refresh(true);
const c0 = load("stats_last"); if (c0) render(c0);
refresh(false);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(false); });
</script>
</body>
</html>
